<style>
/* System fonts - no external deps */
*{margin:0;padding:0;box-sizing:border-box}
:root{--c1:#a855f7;--c2:#ec4899;--c3:#06b6d4;--c4:#f59e0b;--c5:#10b981;--cdanger:#ef4444;--cbg:#0f0a1a;--csurface:rgba(255,255,255,0.04);--cglass:rgba(255,255,255,0.08)}
html,body{width:100%;height:100%;overflow:hidden;touch-action:manipulation;background:var(--cbg);font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
canvas{display:block;margin:0 auto;border-radius:4px}

/* ---- floating bg orbs ---- */
#bg-orbs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:0.12;animation:orbFloat 12s ease-in-out infinite}
.orb:nth-child(1){width:200px;height:200px;background:var(--c1);top:10%;left:-10%;animation-delay:0s}
.orb:nth-child(2){width:160px;height:160px;background:var(--c2);top:60%;right:-8%;animation-delay:-4s}
.orb:nth-child(3){width:140px;height:140px;background:var(--c3);bottom:-5%;left:30%;animation-delay:-8s}
@keyframes orbFloat{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,-20px) scale(1.15)}66%{transform:translate(-20px,15px) scale(0.9)}}

/* ---- sound panel ---- */
#sound-panel{position:fixed;top:10px;right:10px;z-index:30;display:flex;align-items:center;gap:6px;background:rgba(15,10,26,0.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,0.1);border-radius:24px;padding:4px 10px 4px 6px;transition:all 0.3s}
#sound-btn{width:32px;height:32px;border-radius:50%;border:none;background:rgba(255,255,255,0.08);color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#sound-btn:hover{background:rgba(255,255,255,0.16)}
#vol-slider{-webkit-appearance:none;appearance:none;width:0;overflow:hidden;height:4px;border-radius:2px;background:rgba(255,255,255,0.12);outline:none;transition:width 0.3s;cursor:pointer}

#vol-slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c2));cursor:pointer;box-shadow:0 0 10px rgba(168,85,247,0.5)}
#vol-slider::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c2));cursor:pointer;border:none;box-shadow:0 0 10px rgba(168,85,247,0.5)}

/* ---- level bar ---- */
#ui-bar{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:center;align-items:center;gap:5px;padding:10px 8px 16px;flex-wrap:wrap;pointer-events:none}
#ui-bar>*{pointer-events:auto}
#ui-bar button{position:relative;padding:8px 13px;border:1.5px solid rgba(255,255,255,0.12);border-radius:22px;font-size:11px;font-weight:700;color:rgba(255,255,255,0.85);cursor:pointer;background:rgba(255,255,255,0.05);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:all 0.25s cubic-bezier(0.34,1.56,0.64,1);white-space:nowrap;overflow:hidden}
#ui-bar button::before{content:'';position:absolute;inset:0;border-radius:22px;background:linear-gradient(135deg,var(--c1),var(--c2));opacity:0;transition:opacity 0.25s;z-index:-1}
#ui-bar button.current::before{opacity:1}
#ui-bar button.current{color:#fff;border-color:transparent;box-shadow:0 0 18px rgba(168,85,247,0.4);animation:btnPulse 2s ease-in-out infinite}
#ui-bar button.cleared{border-color:rgba(16,185,129,0.4);background:rgba(16,185,129,0.1);color:rgba(255,255,255,0.7)}
#ui-bar button.cleared::before{background:linear-gradient(135deg,var(--c5),#34d399)}
#ui-bar button.locked{opacity:0.2;pointer-events:none;filter:grayscale(0.6)}
#ui-bar button:active:not(.locked){transform:scale(0.9)}
#ui-bar button .star-dot{display:inline-block;font-size:8px;margin-left:1px;animation:starBounce 0.6s ease-out}
@keyframes btnPulse{0%,100%{box-shadow:0 0 18px rgba(168,85,247,0.4)}50%{box-shadow:0 0 28px rgba(236,72,153,0.55)}}
@keyframes starBounce{0%{transform:scale(0) rotate(-30deg)}60%{transform:scale(1.4) rotate(10deg)}100%{transform:scale(1) rotate(0)}}

/* ---- reset btn ---- */
#ui-bar .sep{color:rgba(255,255,255,0.1);margin:0 2px;pointer-events:none}
#ui-bar .util-btn{padding:8px 12px;border:1px solid rgba(255,255,255,0.08);border-radius:20px;font-size:13px;background:rgba(255,255,255,0.03);color:rgba(255,255,255,0.5);cursor:pointer;transition:all 0.2s}
#ui-bar .util-btn:hover{background:rgba(255,255,255,0.08);color:#fff}

/* ---- level transition overlay ---- */
#lvl-overlay{position:fixed;inset:0;z-index:25;pointer-events:none;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 0.3s}
#lvl-overlay.show{opacity:1}
#lvl-overlay .lvl-num{font-size:72px;font-weight:900;background:linear-gradient(135deg,var(--c1),var(--c2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:lvlPop 0.6s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes lvlPop{0%{transform:scale(0.3);opacity:0}50%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}

#sound-panel{position:fixed;top:10px;right:10px;z-index:30;display:flex;align-items:center;gap:4px;background:rgba(15,10,26,0.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,0.1);border-radius:24px;padding:2px 6px 2px 2px;transition:opacity 0.3s;cursor:grab;user-select:none}
#sound-panel.dragging{cursor:grabbing;opacity:0.85}
#sound-panel.minimized{border-radius:50%;padding:2px}
#sound-panel.minimized #vol-slider,#sound-panel.minimized #sound-grip{display:none}
#sound-grip{width:18px;height:32px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.25);font-size:9px;cursor:grab;border-radius:20px;line-height:1;letter-spacing:-2px;flex-shrink:0}
#sound-grip:hover{color:rgba(255,255,255,0.55)}
#vol-slider{width:60px;height:4px;-webkit-appearance:none;appearance:none;background:rgba(255,255,255,0.15);border-radius:2px;outline:none;cursor:pointer}
#vol-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;cursor:pointer;border:2px solid rgba(168,85,247,0.6)}
#sound-btn{width:34px;height:34px;border-radius:50%;border:none;background:rgba(255,255,255,0.08);color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 0.2s;flex-shrink:0;padding:0;line-height:1}
#sound-btn:hover{background:rgba(255,255,255,0.16)}


@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{transform:scale(0.8);opacity:0}to{transform:scale(1);opacity:1}}
#ach-modal::-webkit-scrollbar{display:none}
</style>
</head>

<script>
// ==================== AUDIO ====================
let soundEnabled=true,volMaster=0.6;
const AC=new(window.AudioContext||window.webkitAudioContext)();
function ensureAudio(){if(AC.state==='suspended')AC.resume();if(AC.state==='suspended'){AC.resume();try{AC.resume()}catch(e){}}}
document.addEventListener('click',()=>{ensureAudio();requestGyroPermission()},{once:true});
document.addEventListener('touchstart',()=>{ensureAudio();requestGyroPermission()},{once:true});

// Sound panel drag & minimize
(function(){
  var panel=document.getElementById('sound-panel');
  var grip=document.getElementById('sound-grip');
  var btn=document.getElementById('sound-btn');
  if(!panel||!grip)return;
  var dragging=false,ox=0,oy=0,px=0,py=0;
  grip.addEventListener('mousedown',function(e){dragging=true;ox=e.clientX;oy=e.clientY;var r=panel.getBoundingClientRect();px=r.left;py=r.top;panel.classList.add('dragging');e.preventDefault()});
  grip.addEventListener('touchstart',function(e){dragging=true;var t=e.touches[0];ox=t.clientX;oy=t.clientY;var r=panel.getBoundingClientRect();px=r.left;py=r.top;panel.classList.add('dragging');e.preventDefault()},{passive:false});
  document.addEventListener('mousemove',function(e){if(!dragging)return;panel.style.left=(px+e.clientX-ox)+'px';panel.style.top=(py+e.clientY-oy)+'px';panel.style.right='auto'});
  document.addEventListener('touchmove',function(e){if(!dragging)return;var t=e.touches[0];panel.style.left=(px+t.clientX-ox)+'px';panel.style.top=(py+t.clientY-oy)+'px';panel.style.right='auto'},{passive:false});
  document.addEventListener('mouseup',function(){if(dragging){dragging=false;panel.classList.remove('dragging')}});
  document.addEventListener('touchend',function(){if(dragging){dragging=false;panel.classList.remove('dragging')}});
  btn.addEventListener('dblclick',function(e){e.stopPropagation();panel.classList.toggle('minimized')});
})();


// Speech synthesis for encouragement/failure
let speechSynth=null;
function initSpeech(){if(!speechSynth&&window.speechSynthesis)speechSynth=window.speechSynthesis}
function speak(text,rate=1.1,pitch=1.2){
  if(!soundEnabled)return;
  initSpeech();
  if(!speechSynth)return;
  try{
    speechSynth.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='zh-CN';u.rate=rate;u.pitch=pitch;u.volume=Math.min(1,volMaster*1.2);
    speechSynth.speak(u);
  }catch(e){}
}
function voiceEncourage(){
  const lines=['\u592a\u68d2\u4e86\uff01','\u4f60\u771f\u5389\u5bb3\uff01','\u5947\u8ff9\uff01','\u8111\u6d1e\u5927\u5f00\uff01','\u5929\u624d\uff01','\u725b\u903c\uff01'];
  speak(lines[Math.floor(Math.random()*lines.length)],1.2,1.3);
}
function voiceFail(){
  const lines=['\u54c8\u54c8\u7ffb\u8f66\u4e86','\u518d\u8bd5\u8bd5\uff5e','\u5dee\u4e00\u70b9\u70b9','\u5618\uff0c\u88ab\u5957\u8def\u4e86\u5427','\u522b\u6c14\u998a\uff0c\u518d\u6765','\u563f\u563f\uff0c\u4e2d\u8ba1\u4e86'];
  speak(lines[Math.floor(Math.random()*lines.length)],1.0,0.9);
}

let bgMusicNode=null,bgMusicOn=false;
function startBgMusic(){
  if(bgMusicOn||!soundEnabled)return;
  ensureAudio();bgMusicOn=true;
  // Relaxed lo-fi chill melody - gentle pentatonic
  const pent=[262,294,330,392,440,523,588,660,784,880,1047];
  // Soft dreamy melody
  const melody=[4,7,9,7,4,5,4,2,0,2,4,0,2,4,5,4,2,0,4,7,5,4,2,0,4,7,9,12,9,7,5,4,2,0];
  const bassLine=[0,0,4,4,7,7,5,5,0,0,4,4,2,2,0,0];
  let step=0,bStep=0;
  function playNote(){
    if(!bgMusicOn||!soundEnabled){bgMusicNode=null;return}
    try{
      const now=AC.currentTime,v=0.035*volMaster;
      // Soft melody - sine wave for chill vibe
      const o1=AC.createOscillator(),g1=AC.createGain();
      o1.type='sine';
      const ni=melody[step%melody.length];
      o1.frequency.value=pent[ni%pent.length]*Math.pow(2,Math.floor(ni/pent.length));
      g1.gain.setValueAtTime(v,now);
      g1.gain.setValueAtTime(v,now+0.05);
      g1.gain.exponentialRampToValueAtTime(0.001,now+2.2);
      o1.connect(g1);g1.connect(masterGain);
      o1.start(now);o1.stop(now+2.5);
      // Soft pad bass
      if(bStep%4===0){
        const o2=AC.createOscillator(),g2=AC.createGain();
        o2.type='sine';
        o2.frequency.value=pent[bassLine[bStep%bassLine.length]]*0.5;
        g2.gain.setValueAtTime(v*0.5,now);
        g2.gain.exponentialRampToValueAtTime(0.001,now+4);
        o2.connect(g2);g2.connect(masterGain);
        o2.start(now);o2.stop(now+4.2);
      }
      bStep++;
    }catch(e){}
    step++;
    bgMusicNode=setTimeout(playNote,600);
  }
  playNote();
}function stopBgMusic(){
  bgMusicOn=false;
  if(bgMusicNode){clearTimeout(bgMusicNode);bgMusicNode=null}
}

let masterGain=AC.createGain();masterGain.gain.value=volMaster;masterGain.connect(AC.destination);
function beep(f,d,t='square',v=0.12){if(!soundEnabled)return;ensureAudio();try{const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v*volMaster,AC.currentTime);g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d);o.connect(g);g.connect(masterGain);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function sfxBounce(){beep(260,0.12,'square',0.12);setTimeout(()=>beep(440,0.1,'square',0.1),70);setTimeout(()=>beep(660,0.08,'sine',0.08),120)}
function sfxShake(){for(let i=0;i<5;i++)setTimeout(()=>beep(40+Math.random()*30,'sawtooth',0.06,0.06),i*45)}
function sfxPop(){beep(800,0.06,'sine',0.08);setTimeout(()=>beep(600,0.05,'sine',0.06),40)}
function sfxFail(){beep(200,'square',0.1,0.1);setTimeout(()=>beep(140,'square',0.08,0.12),100);setTimeout(()=>beep(100,'sawtooth',0.06,0.15),180)}
function sfxClear(){[523,659,784,1047,1319,1568].forEach((f,i)=>setTimeout(()=>beep(f,'sine',0.12,0.12),i*70))}
function sfxStar(){[660,880,1100,1320].forEach((f,i)=>setTimeout(()=>beep(f,'sine',0.1,0.1),i*90))}
function sfxGameOver(){[300,240,180,120,80].forEach((f,i)=>setTimeout(()=>beep(f,'square',0.15,0.15),i*180))}
function sfxTransition(){[440,554,660,880].forEach((f,i)=>setTimeout(()=>beep(f,'sine',0.08,0.1),i*60))}
// rhythmic pulse - subtle bg beat
let rhyTimer=null,rhyActive=false;
function startRhythm(){if(rhyActive)return;ensureAudio();rhyActive=true;
  function tick(){if(!rhyActive||!soundEnabled)return;
    beep(55+Math.sin(Date.now()/3000)*8,'sine',0.15,0.025);
    rhyTimer=setTimeout(tick,800+Math.sin(Date.now()/5000)*200)}
  tick()}
function stopRhythm(){rhyActive=false;if(rhyTimer)clearTimeout(rhyTimer)}

// ==================== CANVAS ====================
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H,CX,CY;
function resize(){const dpr=Math.min(devicePixelRatio||1,2);W=Math.min(innerWidth,500);H=Math.min(innerHeight,900);CX=W/2;CY=H/2;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
resize();addEventListener('resize',resize);

// ==================== PARTICLES ====================
const P=[];let confetti=[];
function sp(x,y,c,n=8,s=2,l=1){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=s*(0.3+Math.random());P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,c,l,a:0,ml:l,s:2+Math.random()*5})}}
function spConfetti(n=40){const cs=['#ff6b6b','#feca57','#48dbfb','#ff9ff3','#54a0ff','#5f27cd','#01a3a4','#f368e0'];for(let i=0;i<n;i++){confetti.push({x:Math.random()*W,y:-30-Math.random()*H,vy:2+Math.random()*4,vx:(Math.random()-0.5)*3,r:Math.random()*360,rv:(Math.random()-0.5)*10,c:cs[Math.floor(Math.random()*cs.length)],s:5+Math.random()*8})}}
function upP(dt){for(let i=P.length-1;i>=0;i--){const p=P[i];p.a+=dt;p.x+=p.vx*60*dt;p.y+=p.vy*60*dt;p.vy+=120*dt;if(p.a>=p.ml)P.splice(i,1)}for(let i=confetti.length-1;i>=0;i--){const c=confetti[i];c.y+=c.vy*60*dt;c.x+=c.vx*60*dt;c.r+=c.rv*60*dt;c.vy+=60*dt;if(c.y>H+50)confetti.splice(i,1)}}
function drP(){P.forEach(p=>{const a=1-p.a/p.ml;ctx.globalAlpha=a;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.s*a,0,Math.PI*2);ctx.fill()});confetti.forEach(c=>{ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.r*Math.PI/180);ctx.fillStyle=c.c;ctx.fillRect(-c.s/2,-c.s/2,c.s,c.s);ctx.restore()});ctx.globalAlpha=1}

// ==================== SHAKE ====================
let sX=0,sY=0,sD=0,sI=0;
function shake(i=8,d=0.35){sI=i;sD=d}
function upS(dt){if(sD>0){sD-=dt;const t=sD;sX=(Math.sin(t*50)+Math.cos(t*37))*sI*(sD/0.35);sY=(Math.cos(t*43)+Math.sin(t*61))*sI*(sD/0.35)}else{sX=0;sY=0}}

// ==================== TOAST ====================
let tt='',ta=0,td=0,ttScale=0;
function toast(tx,d=2.2){tt=tx;ta=1;td=d;ttScale=0.5;if(tx.length>20)td=Math.max(d,2.8)}
function upT(dt){if(td>0){td-=dt;ttScale=Math.min(1,ttScale+dt*5);if(td<0.5)ta=Math.max(0,td/0.5)}else ta=0}
function drT(){if(ta<=0||!tt)return;const lines=tt.split('\n');let mw=0;ctx.font='bold 15px "Noto Sans SC","PingFang SC","Microsoft YaHei"';lines.forEach(l=>{const w=ctx.measureText(l).width;if(w>mw)mw=w});const tw=mw+48,th=26+lines.length*26,tx=CX-tw/2,ty=H*0.64;ctx.save();ctx.translate(CX,ty+th/2);ctx.scale(ttScale,ttScale);ctx.translate(-CX,-(ty+th/2));ctx.globalAlpha=ta;const tg=ctx.createLinearGradient(tx,ty,tx,ty+th);tg.addColorStop(0,'rgba(30,10,50,0.93)');tg.addColorStop(1,'rgba(15,5,28,0.95)');ctx.fillStyle=tg;ctx.beginPath();ctx.roundRect(tx,ty,tw,th,18);ctx.fill();ctx.strokeStyle='rgba(168,85,247,0.4)';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(tx,ty,tw,th,18);ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 15px "Noto Sans SC","PingFang SC","Microsoft YaHei"';ctx.textAlign='center';lines.forEach((l,i)=>{ctx.fillText(l,CX,ty+28+i*26)});ctx.textAlign='start';ctx.restore();ctx.globalAlpha=1}

// ==================== SAVE ====================
const SK='td_v4';
// Achievement definitions
const ACHIEVEMENTS=[
  {id:'fail10',name:'\u7ffb\u8f66\u65b0\u624b',desc:'\u5931\u8d25\u8fbe10\u6b21',icon:'\u{1F3AA}',check:d=>d.fails>=10},
  {id:'fail50',name:'\u7ffb\u8f66\u8fbe\u4eba',desc:'\u5931\u8d25\u8fbe50\u6b21',icon:'\u{1F3AD}',check:d=>d.fails>=50},
  {id:'fail100',name:'\u7ffb\u8f66\u5927\u5e08',desc:'\u5931\u8d25\u8fbe100\u6b21',icon:'\u{1F3C6}',check:d=>d.fails>=100},
  {id:'perfect3',name:'\u4e09\u661f\u901a\u5173',desc:'\u83b7\u5f973\u51733\u661f',icon:'\u2b50',check:d=>(d.stars||[]).filter(s=>s>=3).length>=3},
  {id:'perfect5',name:'\u4e94\u661f\u4e0a\u5c06',desc:'\u83b7\u5f975\u51733\u661f',icon:'\u{1F31F}',check:d=>(d.stars||[]).filter(s=>s>=3).length>=5},
  {id:'allclear',name:'\u5168\u90e8\u901a\u5173',desc:'\u901a\u5173\u5168\u90e810\u5173',icon:'\u{1F389}',check:d=>d.cl.filter(c=>c).length>=10},
  {id:'speedrun',name:'\u8fde\u51fb\u8fbe\u4eba',desc:'\u8fde\u7eed\u901a\u51733\u5173',icon:'\u{1F525}',check:d=>(d.streak||0)>=3},
  {id:'star20',name:'\u661f\u661f\u6536\u85cf\u5bb6',desc:'\u7d2f\u8ba1\u83b7\u5f9720\u661f',icon:'\u{1F4AB}',check:d=>(d.stars||[]).reduce((a,b)=>a+b,0)>=20},
  {id:'hidden',name:'\u9690\u85cf\u6b21\u5143\u5f69\u86cb',desc:'\u53d1\u73b0\u9690\u85cf\u5f69\u86cb',icon:'\u{1F381}',check:d=>d.hiddenEgg||false},
];
let achPopup=null,achQueue=[];
function load(){try{const d=JSON.parse(localStorage.getItem(SK));if(d&&d.cl&&d.snd!==undefined)return d}catch(e){}return{cl:[false,false,false,false,false,false,false,false,false,false],snd:true,vol:0.6,stars:[],fails:0,streak:0,hiddenEgg:false,achievements:[]}}

function checkAchievements(d){
  const newAch=[];
  ACHIEVEMENTS.forEach(a=>{
    if(!(d.achievements||[]).includes(a.id)&&a.check(d)){
      d.achievements=d.achievements||[];
      d.achievements.push(a.id);
      newAch.push(a);

// ==================== DRAW HELPERS ====================
function rrect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function btn(x,y,w,h,t,c1,c2){
  ctx.save();ctx.translate(x,y);ctx.fillStyle='rgba(0,0,0,0.25)';rrect(-w/2,-h/2+2,w,h,h/2);
  const g=ctx.createLinearGradient(-w/2,-h/2,-w/2,h/2);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g;rrect(-w/2,-h/2,w,h,h/2);
  ctx.fillStyle='rgba(255,255,255,0.16)';ctx.beginPath();ctx.ellipse(0,-h/2+10,w*0.26,h*0.1,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 20px "PingFang SC","Microsoft YaHei"';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t,0,0);ctx.restore()
}
let hudPulse=0;
function hud(title,attempts,maxAttempts,stars=0){
  hudPulse+=0.03;const pulse=Math.sin(hudPulse)*0.08+1;
  ctx.fillStyle='rgba(0,0,0,0.4)';ctx.beginPath();ctx.roundRect(8,8,W-16,38,12);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.06)';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(8,8,W-16,38,12);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='bold 12px "Noto Sans SC","PingFang SC","Microsoft YaHei"';
  ctx.fillText(title,18,34);
  for(let i=0;i<maxAttempts;i++){
    const alive=i<attempts;
    if(alive){ctx.fillStyle='#ff4757';ctx.font=(14*pulse).toFixed(0)+'px sans-serif'}
    else{ctx.fillStyle='rgba(255,255,255,0.1)';ctx.font='12px sans-serif'}
    ctx.fillText('\u2665',W-28-(maxAttempts-i)*22,32)}
  if(stars>0){ctx.fillStyle='#ffd700';ctx.font='bold 11px "Noto Sans SC"';ctx.fillText('\u2665'.repeat(stars),W-70,54)}
}

class BaseLevel{
  constructor(g){this.g=g;this.done=false;this.attempts=5;this.maxA=5;this.trollCalls=0}
  useAttempt(){this.trollCalls++;this.attempts--;if(this.attempts<=0){this.g.doGameOver();return true}return false}
  getStars(){if(this.trollCalls<=1)return 3;if(this.trollCalls<=3)return 2;return 1}
}

  onDragMove(x,y,dx,dy){if(this.draggingCup){this.cupX=x;this.cupY=y;if(Math.abs(this.cupX-this.candleX)<40&&Math.abs(this.cupY-this.candleY)<50&&!this.done){this.done=true;this.flameSize=0;sfxFail();sp(this.candleX,this.candleY,'#B3E5FC',20,2,1);toast('馃挧 娴囩伃浜嗭紒');setTimeout(()=>this.g.doClear(this.getStars()),1500)}}}
  onDragEnd(){this.draggingCup=false}
  destroy(){this.done=true;this.draggingCup=false}
}

// ==================== LEVEL 10: 鎵惧埌闅愯棌閽ュ寵 ====================
class L10 extends BaseLevel{
  constructor(g){super(g);this.keyOnBack=true;this.playerX=CX;this.playerY=H*0.55;this.playerRot=0;this.furniture=[{x:W*0.25,y:H*0.4},{x:W*0.6,y:H*0.35},{x:W*0.8,y:H*0.45}];this.furnTaps=0;this.turned=false}
  update(dt){upP(dt);upS(dt);upT(dt);if(this.turned&&this.playerRot<Math.PI){this.playerRot+=dt*3;if(this.playerRot>=Math.PI&&!this.done){this.done=true;sfxPop();toast('馃攽 閽ュ寵涓€鐩村湪韬笂锛?);sp(this.playerX,this.playerY,'#ffd700',25,3,1);setTimeout(()=>this.g.doClear(this.getStars()),1800)}}}
  draw(){
    ctx.fillStyle='#FFF8E1';ctx.fillRect(0,0,W,H);
    ctx.save();ctx.translate(sX,sY);
    hud('馃攽 绗?10 鍏?路 鎵惧埌闅愯棌閽ュ寵',this.attempts,this.maxA);
    // Furniture
    this.furniture.forEach((f,i)=>{
      ctx.fillStyle=['#8D6E63','#A1887F','#6D4C41'][i];rrect(f.x-35,f.y,70,80,6);
      ctx.fillStyle='#FFD54F';ctx.beginPath();ctx.arc(f.x-15,f.y+30,5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(f.x+15,f.y+30,5,0,Math.PI*2);ctx.fill()
    });
    // Player
    ctx.save();ctx.translate(this.playerX,this.playerY);ctx.rotate(this.playerRot);
    ctx.fillStyle='#FFDAB9';ctx.beginPath();ctx.arc(0,-22,16,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#4488ff';rrect(-10,8,20,24,6);
    // Key on back (visible when rotated)
    if(this.playerRot>1.5){ctx.fillStyle='#FFD700';ctx.strokeStyle='#FFA000';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,12,10,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#FFA000';rrect(0,12,20,4,2)}
    ctx.restore();
    if(this.furnTaps>=3&&!this.turned){ctx.fillStyle='rgba(255,230,102,0.7)';ctx.font='bold 12px "PingFang SC","Microsoft YaHei"';ctx.textAlign='center';ctx.fillText('馃挕 璇曡瘯婊戝姩涓昏杞韩锛?,CX,H*0.92);ctx.textAlign='start'}
    ctx.restore();drP();drT();
  }
  onTap(x,y){
    if(this.done||this.g._cl||this.g._paused)return;
    this.furniture.forEach(f=>{if(Math.abs(x-f.x)<40&&Math.abs(y-(f.y+40))<45){this.furnTaps++;sfxFail();shake(4,0.2);sp(x,y,'#ff6b6b',6,2,0.6);
      if(this.useAttempt())return;
      toast(['绌虹殑锛侌煋?,'娌℃湁閽ュ寵~','鍙堟槸闄烽槺锛?][Math.min(this.furnTaps-1,3)])}})
  }
  onDragStart(x,y){if(this.done||this.g._paused)return}
  onDragMove(x,y,dx,dy){
    if(this.done||this.g._paused||this.turned)return;
    if(Math.abs(x-this.playerX)<40&&Math.abs(y-this.playerY)<40&&Math.abs(dx)>15){this.turned=true;toast('馃攧 杞韩浜嗭紒')}
  }
  onDragEnd(){}
  destroy(){this.done=true}
}

// ==================== GYROSCOPE (for Level 5 flip) ====================
let gyroPermitted=false;
function requestGyroPermission(){
  if(gyroPermitted)return;
  if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
    DeviceOrientationEvent.requestPermission().then(s=>{
      if(s==='granted'){gyroPermitted=true;console.log('Gyro: granted')}
    }).catch(e=>console.log('Gyro denied:',e));
  }else{
    // Non-iOS or older iOS - permission not needed
    gyroPermitted=true;
  }
}
window.addEventListener('deviceorientation',e=>{
  if(!gyroPermitted)requestGyroPermission();
  if(game.scene&&game.scene.onOrientation)game.scene.onOrientation(e.beta,e.gamma)
});

// ==================== LOOP ====================
let lt=0;
function loop(t){const dt=Math.min((t-lt)/1000,0.1);lt=t;ctx.clearRect(0,0,W,H);if(game.scene){game.scene.update(dt);game.scene.draw()}requestAnimationFrame(loop)}
// Hidden egg: triple tap top-left corner
let eggTaps=0,eggTimer=null;
canvas.addEventListener('pointerdown',e=>{
  const r=canvas.getBoundingClientRect();
  const x=(e.clientX||0)-r.left,y=(e.clientY||0)-r.top;
  if(x<50&&y<50){
    eggTaps++;
    if(eggTimer)clearTimeout(eggTimer);
    eggTimer=setTimeout(()=>{eggTaps=0},800);
    if(eggTaps>=3&&!game.data.hiddenEgg){
      game.data.hiddenEgg=true;save(game.data);
      sp(CX,CY,'#ff0',60,5,2);spConfetti(50);
      toast('\u{1F389} \u53d1\u73b0\u9690\u85cf\u5f69\u86cb\uff01\n\u4f60\u662f\u771f\u6b63\u7684\u63a2\u7d22\u8005\uff01',3);
      checkAchievements(game.data);
    }
  }
});
try{game.init();var lm=document.getElementById('loading-msg');if(lm)lm.style.display='none'}catch(e){console.error(e);var lm=document.getElementById('loading-msg');if(lm)lm.textContent='\u52a0\u8f7d\u5931\u8d25\uff0c\u8bf7\u5237\u65b0\u9875\u9762'}requestAnimationFrame(loop);if(soundEnabled){startBgMusic();}

// Sound panel drag + double-click minimize
(function(){
  var panel=document.getElementById('sound-panel');
  var btn=document.getElementById('sound-btn');
  var isDragging=false,startX,startY,initX,initY;
  panel.addEventListener('pointerdown',function(e){
    if(e.target===btn||e.target.tagName==='INPUT')return;
    isDragging=true;panel.classList.add('dragging');
    startX=e.clientX;startY=e.clientY;
    var r=panel.getBoundingClientRect();
    initX=r.left;initY=r.top;
    panel.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  window.addEventListener('pointermove',function(e){
    if(!isDragging)return;
    panel.style.left=(initX+e.clientX-startX)+'px';
    panel.style.top=(initY+e.clientY-startY)+'px';
    panel.style.right='auto';
  });
  window.addEventListener('pointerup',function(){
    if(isDragging){isDragging=false;panel.classList.remove('dragging')}
  });
  btn.addEventListener('dblclick',function(e){
    e.preventDefault();e.stopPropagation();
    panel.classList.toggle('minimized');
  });
  btn.addEventListener('pointerdown',function(e){
    game.toggleSound();
    e.stopPropagation();
  });
})();

</script>
